# Parametros de JCL por ambiente - um bloco por membro (job), um sub-bloco
# por ambiente (TU/TI/PRD). Cada chave e um placeholder ${NOME} do JCL.
#
# Fonte da verdade dos valores. scripts/sincronizar-variables.py publica
# estes valores como GitHub variables JCL_<NOME> em cada Environment; na
# esteira, a variable do Environment tem precedencia sobre este arquivo
# (o Job Summary mostra a origem de cada valor).

ESTMX001:
  TU:
    ACCT: "ESTM,0001,TU01"
    PROGRAMMER: "ESTMTU"
    CLASS: "A"
    MSGCLASS: "X"
    SCHENV: "BATCHTU"
    NOTIFY: "ESTMTU"
    HLQ: "ESTM.POK.TU"
    UNIT: "SYSDA"
    SPACE_PRIMARY: "000600"
    SPACE_SECONDARY: "0240"
    DATACLAS: "DCTESTE"
  TI:
    ACCT: "ESTM,0001,TI01"
    PROGRAMMER: "ESTMTI"
    CLASS: "A"
    MSGCLASS: "X"
    SCHENV: "BATCHTI"
    NOTIFY: "ESTMTI"
    HLQ: "ESTM.POC.TI"
    UNIT: "SYSDA"
    SPACE_PRIMARY: "000600"
    SPACE_SECONDARY: "0240"
    DATACLAS: "DCTESTE"
  PRD:
    ACCT: "ESTM,0001,PR01"
    PROGRAMMER: "ESTMPRD"
    CLASS: "P"
    MSGCLASS: "Z"
    SCHENV: "BATCH"
    NOTIFY: "ESTMPRD"
    HLQ: "ESTM.POC.PRD"
    UNIT: "DISCO"
    SPACE_PRIMARY: "006000"
    SPACE_SECONDARY: "2400"
    DATACLAS: "DCPRODX"
